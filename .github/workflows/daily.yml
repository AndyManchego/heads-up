name: Daily bill update

on:
  schedule:
    - cron: "0 11 * * *"     # every day at 11:00 UTC (7am Eastern)
  workflow_dispatch:          # lets you click "Run workflow" by hand
    inputs:
      days:
        description: "How many days back to look (use 14 for the first run)"
        default: "2"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch_bills.py
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LOOKBACK_DAYS: ${{ github.event.inputs.days || '2' }}
